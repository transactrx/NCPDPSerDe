# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "**" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.21

      - name: Build
        run: go build -v ./...

      # -race catches unsynchronized access to the shared reflection caches;
      # the concurrency test in pkg/claimSerializer exercises them in parallel.
      - name: Test
        run: go test -race -v ./...

      # Short round-trip fuzz pass: the committed corpus replays as regression
      # seeds and the extra time explores around them. Findings fail the build.
      - name: Fuzz round-trip invariants
        run: go test -fuzz=FuzzRoundTrip -fuzztime=60s ./pkg/claimSerializer